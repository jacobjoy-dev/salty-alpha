{% extends 'base.html' %}
{% block title %}Delete Threat - ThreatPro{% endblock %}
{% block content %}
<h2 class="mb-4">Delete Threat Detection</h2>
<p>Are you sure you want to delete this threat?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'threat_list' %}" class="btn btn-secondary ms-2">⬅ Cancel</a>
</form>
{% endblock %}
