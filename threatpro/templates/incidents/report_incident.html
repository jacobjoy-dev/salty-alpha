{% extends 'base.html' %}
{% block title %}Report Incident - ThreatPro{% endblock %}
{% block content %}
<h2 class="mb-4">Report an Incident</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary ms-2">⬅ Back to Dashboard</a>
</form>
{% endblock %}
